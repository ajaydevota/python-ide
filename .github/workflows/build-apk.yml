name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch proot + Alpine rootfs
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 app/src/main/assets/proot
          curl -sL -o /tmp/pa.zip https://github.com/ahmed-alnassif/proot/releases/download/v26.08.25-7266fb3/proot-aarch64.zip
          curl -sL -o /tmp/px.zip https://github.com/ahmed-alnassif/proot/releases/download/v26.08.25-7266fb3/proot-x86_64.zip
          unzip -o /tmp/pa.zip -d /tmp/pa
          unzip -o /tmp/px.zip -d /tmp/px
          cp /tmp/pa/proot  app/src/main/jniLibs/arm64-v8a/libproot.so
          cp /tmp/pa/loader app/src/main/jniLibs/arm64-v8a/libproot_loader.so
          cp /tmp/px/proot  app/src/main/jniLibs/x86_64/libproot.so
          cp /tmp/px/loader app/src/main/jniLibs/x86_64/libproot_loader.so
          curl -sL -o app/src/main/assets/proot/alpine-aarch64.rootfs https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          curl -sL -o app/src/main/assets/proot/alpine-x86_64.rootfs https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.3-x86_64.tar.gz

      - name: Generate launcher icons
        run: python3 tools/gen_icons.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
